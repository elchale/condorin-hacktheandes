[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "condorin"
version = "0.1.0"
description = "Detects illegal-mining vessels on Amazon rivers in satellite imagery and reports every scene to the Condorin backend."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Cloud Run Job `condorin-detector` (python -m condorin.job), without the model runtime.
job = [
    "google-cloud-storage>=2.16",
    "google-auth>=2.29",
    "requests>=2.31",
]
# Model runtime for the Job. Pinned to the versions the model is trained and evaluated with; change
# them together with model_card.json `training.ultralytics` / `training.torch` (see models/README.md).
# torch itself comes from the PyTorch CPU wheel index (docker/job.Dockerfile pins the same version).
ml = [
    "ultralytics==8.4.182",
    "torch==2.14.1",
]
# Cloud Run service `condorin-detector-trigger`: no torch, no ultralytics.
trigger = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "google-cloud-storage>=2.16",
    "google-auth>=2.29",
    "requests>=2.31",
]
dev = [
    "httpx2>=2.13",  # starlette's TestClient (tests/test_trigger.py)
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Source = "https://github.com/sergtello/condorin-detection"

[tool.hatch.build.targets.wheel]
packages = ["src/condorin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore:Using `httpx` with `starlette.testclient`",  # fastapi's TestClient in test_trigger
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # line length is enforced by `ruff format`

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
