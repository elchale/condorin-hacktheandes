[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "condorin"
version = "0.1.0"
description = "Detects illegal-mining vessels on Amazon rivers in satellite imagery and reports them to a Django backend by webhook."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Notifier service (and the HTTP/GCS parts of the detector). No torch, no ultralytics.
notifier = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "google-cloud-storage>=2.16",
]
# Detector service. torch is installed from the PyTorch CPU wheel index in the Dockerfile; it is
# deliberately not pinned here.
serve = [
    "condorin[notifier]",
    "google-cloud-tasks>=2.16",
    "ultralytics>=8.2",
    "torch",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Source = "https://github.com/sergtello/condorin-detection"

[tool.hatch.build.targets.wheel]
packages = ["src/condorin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/examples", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # line length is enforced by `ruff format`

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
